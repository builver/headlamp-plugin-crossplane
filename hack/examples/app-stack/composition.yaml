apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: app-stack
spec:
  compositeTypeRef:
    apiVersion: example.crossplane.io/v1alpha1
    kind: AppStack
  mode: Pipeline
  pipeline:
  - step: kro-run
    functionRef:
      name: function-kro
    input:
      apiVersion: kro.fn.crossplane.io/v1alpha1
      kind: ResourceGraph
      status:
        configMapName: ${config.metadata.name}
        deploymentName: ${deploy.metadata.name}
        serviceName: ${svc.metadata.name}
      resources:
      # All resources are namespaced and land in the AppStack's own namespace
      # (schema.metadata.namespace). A namespaced XR cannot compose
      # cluster-scoped resources such as Namespace.
      - id: config
        template:
          apiVersion: kubernetes.m.crossplane.io/v1alpha1
          kind: Object
          metadata: {}
          spec:
            forProvider:
              manifest:
                apiVersion: v1
                kind: ConfigMap
                metadata:
                  name: ${schema.spec.appName}-config
                  namespace: ${schema.metadata.namespace}
                data:
                  APP_NAME: ${schema.spec.appName}
                  IMAGE: ${schema.spec.image}
      - id: deploy
        template:
          apiVersion: kubernetes.m.crossplane.io/v1alpha1
          kind: Object
          metadata: {}
          spec:
            forProvider:
              manifest:
                apiVersion: apps/v1
                kind: Deployment
                metadata:
                  name: ${schema.spec.appName}
                  namespace: ${schema.metadata.namespace}
                  labels:
                    app: ${schema.spec.appName}
                spec:
                  replicas: 1
                  selector:
                    matchLabels:
                      app: ${schema.spec.appName}
                  template:
                    metadata:
                      labels:
                        app: ${schema.spec.appName}
                    spec:
                      containers:
                      - name: app
                        image: ${schema.spec.image}
                        ports:
                        - containerPort: 80
                        envFrom:
                        - configMapRef:
                            name: ${schema.spec.appName}-config
            references:
            - dependsOn:
                apiVersion: v1
                kind: ConfigMap
                name: ${schema.spec.appName}-config
                namespace: ${schema.metadata.namespace}
      - id: svc
        template:
          apiVersion: kubernetes.m.crossplane.io/v1alpha1
          kind: Object
          metadata: {}
          spec:
            forProvider:
              manifest:
                apiVersion: v1
                kind: Service
                metadata:
                  name: ${schema.spec.appName}
                  namespace: ${schema.metadata.namespace}
                spec:
                  selector:
                    app: ${schema.spec.appName}
                  ports:
                  - port: 80
                    targetPort: 80
            references:
            - dependsOn:
                apiVersion: apps/v1
                kind: Deployment
                name: ${schema.spec.appName}
                namespace: ${schema.metadata.namespace}
  - step: auto-ready
    functionRef:
      name: function-auto-ready
