apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  name: configsets.example.crossplane.io
spec:
  group: example.crossplane.io
  names:
    kind: ConfigSet
    plural: configsets
  scope: Namespaced
  versions:
  - name: v1alpha1
    served: true
    referenceable: true
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            properties:
              appName:
                type: string
                description: Name of the application
              environments:
                type: array
                description: One ConfigMap is created per environment
                items:
                  type: string
                default:
                - dev
                - staging
                - prod
            required:
            - appName
          status:
            type: object
            properties:
              configMaps:
                type: array
                items:
                  type: string
