name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run build

      - run: npm run package

      - name: Resolve tarball
        id: tarball
        run: echo "file=$(ls headlamp-plugin-crossplane-*.tar.gz | head -1)" >> "$GITHUB_OUTPUT"

      - name: Compute checksum
        id: checksum
        run: |
          file="${{ steps.tarball.outputs.file }}"
          echo "sha256=$(sha256sum "$file" | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Derive version and release type
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF_NAME" =~ -rc[0-9]+$ ]]; then
            echo "is_rc=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_rc=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create release and upload asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          TARBALL: ${{ steps.tarball.outputs.file }}
          IS_RC: ${{ steps.version.outputs.is_rc }}
        run: |
          if [[ "$IS_RC" == "true" ]]; then
            gh release create "$TAG" --title "Release $TAG" --notes "Release $TAG" --prerelease "$TARBALL"
          else
            gh release create "$TAG" --title "Release $TAG" --notes "Release $TAG" "$TARBALL"
          fi

      - name: Create versioned artifacthub-pkg.yml
        env:
          TAG: ${{ github.ref_name }}
          TARBALL: ${{ steps.tarball.outputs.file }}
          VERSION: ${{ steps.version.outputs.version }}
          CHECKSUM: ${{ steps.checksum.outputs.sha256 }}
          REPO: ${{ github.repository }}
          IS_RC: ${{ steps.version.outputs.is_rc }}
        run: |
          ARCHIVE_URL="https://github.com/${REPO}/releases/download/${TAG}/${TARBALL}"
          CREATED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          mkdir -p "crossplane/${VERSION}"
          {
            echo "version: ${VERSION}"
            echo "name: crossplane"
            echo "displayName: Crossplane"
            echo "createdAt: \"${CREATED_AT}\""
            [[ "$IS_RC" == "true" ]] && echo "prerelease: true"
            echo "logoURL: \"https://raw.githubusercontent.com/cncf/artwork/main/projects/crossplane/icon/color/crossplane-icon-color.svg\""
            echo "description: A Headlamp plugin for viewing and managing Crossplane resources."
            echo "screenshots:"
            echo "  - title: Overview dashboard"
            echo "    url: https://raw.githubusercontent.com/builver/headlamp-plugin-crossplane/${TAG}/docs/images/overview.png"
            echo "  - title: Composite Resources list"
            echo "    url: https://raw.githubusercontent.com/builver/headlamp-plugin-crossplane/${TAG}/docs/images/composite-resources.png"
            echo "  - title: Composition map view"
            echo "    url: https://raw.githubusercontent.com/builver/headlamp-plugin-crossplane/${TAG}/docs/images/map.png"
            echo "  - title: Composition detail page"
            echo "    url: https://raw.githubusercontent.com/builver/headlamp-plugin-crossplane/${TAG}/docs/images/composition.png"
            echo "  - title: Composition graph editor"
            echo "    url: https://raw.githubusercontent.com/builver/headlamp-plugin-crossplane/${TAG}/docs/images/composition-graph.png"
            echo "annotations:"
            echo "  headlamp/plugin/archive-url: \"${ARCHIVE_URL}\""
            echo "  headlamp/plugin/archive-checksum: \"SHA256:${CHECKSUM}\""
            echo "  headlamp/plugin/version-compat: \">=0.22\""
            echo "  headlamp/plugin/distro-compat: \"in-cluster,web,docker-desktop,desktop\""
          } > "crossplane/${VERSION}/artifacthub-pkg.yml"

      - name: Commit and push
        env:
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout main
          git add "crossplane/${VERSION}/artifacthub-pkg.yml"
          git diff --cached --quiet || git commit -m "chore: add artifacthub-pkg.yml for ${TAG} [skip ci]"
          git push origin main
