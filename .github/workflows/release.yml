name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run build

      - run: npm run package

      - name: Resolve tarball
        id: tarball
        run: echo "file=$(ls headlamp-plugin-crossplane-*.tar.gz | head -1)" >> "$GITHUB_OUTPUT"

      - name: Compute checksum
        id: checksum
        run: |
          file="${{ steps.tarball.outputs.file }}"
          echo "sha256=$(sha256sum "$file" | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Derive version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Create release and upload asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          TARBALL: ${{ steps.tarball.outputs.file }}
        run: |
          gh release create "$TAG" --title "Release $TAG" --notes "Release $TAG" "$TARBALL"

      - name: Update artifacthub-pkg.yml
        env:
          TAG: ${{ github.ref_name }}
          TARBALL: ${{ steps.tarball.outputs.file }}
          VERSION: ${{ steps.version.outputs.version }}
          CHECKSUM: ${{ steps.checksum.outputs.sha256 }}
          REPO: ${{ github.repository }}
        run: |
          ARCHIVE_URL="https://github.com/${REPO}/releases/download/${TAG}/${TARBALL}"
          CREATED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          sed -i "s|^version:.*|version: ${VERSION}|" artifacthub-pkg.yml
          sed -i "s|^createdAt:.*|createdAt: \"${CREATED_AT}\"|" artifacthub-pkg.yml
          sed -i "s|headlamp/plugin/archive-url:.*|headlamp/plugin/archive-url: \"${ARCHIVE_URL}\"|" artifacthub-pkg.yml
          sed -i "s|headlamp/plugin/archive-checksum:.*|headlamp/plugin/archive-checksum: \"SHA256:${CHECKSUM}\"|" artifacthub-pkg.yml

      - name: Commit and push artifacthub-pkg.yml
        env:
          TAG: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacthub-pkg.yml
          git diff --cached --quiet || git commit -m "chore: update artifacthub-pkg.yml for ${TAG} [skip ci]"
          git push origin HEAD:main
